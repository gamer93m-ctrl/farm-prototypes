<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Онбординг — вариант 2</title>
<link rel="stylesheet" href="../shared/generator/generator.css?v=202608092109">
<link rel="stylesheet" href="../shared/farm/farm.css?v=202608092109">
</head>
<body>
<script src="../shared/generator/generator.js?v=202608092109"></script>
<script src="../shared/farm/farm.js?v=202608092109"></script>
<script>
'use strict';

/* ═══ ВАРИАНТ 2: всё крутится вокруг доски заказов ═══

   В первом варианте путь линейный: зерно → кофейня → заказ, и доска
   появляется в конце как новая сущность. Здесь наоборот — доска это
   главная цель с третьей реплики, и весь онбординг идёт циклом:
   взял заказ → не хватает ресурса → сходил и сделал → вернулся, отдал.

   Человек не выходит на карту между шагами просто так: после уровня он
   остаётся на доске, там же узнаёт, чего не хватает, и его ведут за
   ресурсом. Генератор в конце не закрывается сам — стрелка возвращает
   к доске, чтобы цикл читался как цикл. */
const SCRIPT = [
  // кто мы и где мы — два бабла, не больше
  { who:'grandson', text:'Чуваки, это лютый минус вайб — я устал от городской жизни' },
  { who:'granny',   text:'А ты че думал, шегол? В деревне не все так просто, тут нужно со знанием дела, по совести, без суеты бэм бэм…' },

  // цель: доска заказов
  { who:'grandson', text:'Здесь жители оставляют свои заказы. Давай выполним первый',
    spawn:'orders', focus:'orders', pointAt:'.plot[data-id="orders"]', wait:'ordersOpened' },

  // первый заказ уже готов — показываем, чем всё кончается
  // экран не закрываем: уровень придёт прямо поверх заказа, и следующий
  // заказчик появится здесь же — человек всё это время в одном экране
  { orders:'send', order:{ client:0, item:'bean', have:5, need:1 }, stay:true,
    say:'Давай отправим первый готовый заказ' },
  { level:2 },

  // ── цикл: остаёмся на доске, приходит новый заказ и ресурса не хватает ──
  { open:'orders', order:{ client:1, item:'bean', have:0, need:2 },
    tip:'У нас новый заказик, но нет нужного ресурса. Создадим?',
    pointAt:'#orders .back', wait:'ordersClosed' },

  { who:'grandson', text:'Для выполнения заказа нужен генератор',
    focus:'generator', pointAt:'.plot[data-id="gen"]', wait:'generatorOpened' },
  { gen:'seed',  say:'Сажай зерно во все грядки' },
  { gen:'boost', say:'Ждать не обязательно — ускорь', stay:true },

  // экран не закрылся сам: возвращаемся к доске своими руками
  { tip:'Всё, го выполнять заказ', pointAt:'#screen .back', wait:'screenClosed' },
  { focus:'orders', pointAt:'.plot[data-id="orders"]', wait:'ordersOpened' },
  { orders:'send', order:{ client:1, item:'bean', have:5, need:2 }, stay:true,
    say:'Теперь ресурса хватает — отправляй' },
  { level:3 },

  // ── второй виток цикла: теперь просят американо, а варить его негде ──
  { open:'orders', order:{ client:0, item:'cup', have:0, need:1 },
    tip:'Теперь просят американо. Варить негде — нужна кофейня',
    pointAt:'#orders .back', wait:'ordersClosed' },

  { pointAt:'#openSheet', wait:'sheetOpened' },
  { pointAt:'[data-cat="Преобразователи"]', wait:'catOpened' },
  { pointAt:'[data-item="coffee"]', wait:'placing' },
  { hint:'Перетащи здание и жми «Построить»', wait:'built' },

  { pointAt:'.plot[data-item="coffee"]', wait:'cafeOpened' },
  { gen:'seed',  say:'Зёрна в кофейню — на все места' },
  { gen:'boost', say:'Ускорь — американо будет сразу', stay:true },
  { tip:'Американо готов. Возвращаемся к заказу',
    pointAt:'#screen .back', wait:'screenClosed' },

  { focus:'orders', pointAt:'.plot[data-id="orders"]', wait:'ordersOpened' },
  { orders:'send', order:{ client:0, item:'cup', have:5, need:1 }, stay:true,
    say:'Отправляй — заказ закрыт' },
  { level:4 },

  // единственный выход на карту за весь вариант — и он же конец обучения:
  // дальше свободная игра, а она живёт на карте
  { close:true, who:'granny', text:'Дальше сам: заказ, ресурс, заказ. Ферма твоя' },
];

window.farm = createFarm({ script: SCRIPT, variant:'b' });
</script>
</body>
</html>
