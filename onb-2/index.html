<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Онбординг — вариант 2</title>
<link rel="stylesheet" href="../shared/generator/generator.css?v=20260809220350">
<link rel="stylesheet" href="../shared/farm/farm.css?v=20260809220350">
</head>
<body>
<script src="../shared/generator/generator.js?v=20260809220350"></script>
<script src="../shared/farm/farm.js?v=20260809220350"></script>
<script>
'use strict';

/* ═══ ВАРИАНТ 2: всё крутится вокруг доски заказов ═══

   В первом варианте путь линейный: зерно → кофейня → заказ, и доска
   появляется в конце как новая сущность. Здесь наоборот — доска это
   главная цель с третьей реплики, и весь онбординг идёт циклом:
   взял заказ → не хватает ресурса → сходил и сделал → вернулся, отдал.

   Человек не выходит на карту между шагами просто так: после уровня он
   остаётся на доске, там же узнаёт, чего не хватает, и его ведут за
   ресурсом. Генератор в конце не закрывается сам — стрелка возвращает
   к доске, чтобы цикл читался как цикл.

   Длина реплик. Вступительные три бабла длиннее: там нужен контекст, а
   на карте в этот момент всё равно нечего рассматривать — держим до 170
   символов. Дальше по ходу игры реплика не длиннее 96 символов, это три
   строки на 375: длиннее панель лезет на игровое поле. Подсказка внутри
   экрана уже, там до 45.

   Каждая реплика закрывает задачу уровня, а не просто звучит:
     уровень 1 — куда попал, главная задача, первое действие;
     уровень 2 — ресурсы не берутся из ниоткуда, и делают их не грядкой;
     уровень 3 — здания строим сами, генератор и кофейня — одна цепочка. */
const SCRIPT = [
  // ── уровень 1: завязка, цель, первое действие ──
  // Все три реплики от внука, он говорит игроку. Первая даёт жанр и
  // сеттинг: технарь купил поселение и строит тут производства, а не
  // пшеницу с морковкой. Вторая — что он собирается делать руками
  // игрока. Третья — куда нажать. Бабуся вступает позже, там, где нужен
  // деревенский опыт: это и есть связка технологий с деревней.
  { who:'grandson', text:'Купил поселение и сразу всё придумал: производства, бизнесы, своя кофейня. Тут будет не пшеница с морковкой, как на других фермах, а золото, металлы, кофейные зёрна' },
  { who:'grandson', text:'С техникой я на ты, а вот деревню недооценил: без бабуси и её опыта тут ничего не поедет. Вдвоём и развернёмся' },
  { who:'grandson', text:'План простой: строить, запускать производства и делать то, что нужно жителям. Поселение растёт — и мы вместе с ним' },
  { who:'grandson', text:'Начинаем с заказов жителей. Вон доска — открываем',
    spawn:'orders', focus:'orders', pointAt:'.plot[data-id="orders"]', wait:'ordersOpened' },

  { orders:'send', order:{ client:0, item:'bean', have:5, need:1 }, stay:true,
    say:'Отправляй — заказ готов' },
  { level:2 },

  // ── уровень 2: ресурсы надо произвести, и делают их не грядкой ──
  { open:'orders', order:{ client:1, item:'bean', have:0, need:2 },
    tip:'Заказ есть, а зерна нет. Идём делать',
    pointAt:'#orders .back', wait:'ordersClosed' },

  { who:'grandson', text:'На других фермах зерно в поле сеют. У нас его делает генератор — это установка',
    focus:'generator', pointAt:'.plot[data-id="gen"]', wait:'generatorOpened' },
  { gen:'seed',  say:'Заряжай зерно во все ячейки' },
  { gen:'boost', say:'Ждать не обязательно — ускорь', stay:true },
  { tip:'Ресурс твой. Неси в заказ', pointAt:'#screen .back', wait:'screenClosed' },

  { focus:'orders', pointAt:'.plot[data-id="orders"]', wait:'ordersOpened' },
  { orders:'send', order:{ client:1, item:'bean', have:5, need:2 }, stay:true,
    say:'Зерна хватает — отправляй' },
  { level:3 },

  // ── уровень 3: здания строим сами, и цепочка идёт дальше ──
  { open:'orders', order:{ client:0, item:'cup', have:0, need:1 },
    tip:'Просят американо. Его варят из зерна',
    pointAt:'#orders .back', wait:'ordersClosed' },

  { who:'granny', text:'Само зерно в американо не превратится. Нужна кофейня — здания у нас строят сами' },
  { pointAt:'#openSheet', wait:'sheetOpened' },
  { pointAt:'[data-cat="Преобразователи"]', wait:'catOpened' },
  { pointAt:'[data-item="coffee"]', wait:'placing' },
  { hint:'Перетащи здание и жми «Построить»', wait:'built' },

  { pointAt:'.plot[data-item="coffee"]', wait:'cafeOpened' },
  { gen:'seed',  say:'Зерно в кофейню — станет американо' },
  { gen:'boost', say:'Ускорь — американо будет сразу', stay:true },
  { tip:'Готовый продукт. Неси заказчику', pointAt:'#screen .back', wait:'screenClosed' },

  { focus:'orders', pointAt:'.plot[data-id="orders"]', wait:'ordersOpened' },
  { orders:'send', order:{ client:0, item:'cup', have:5, need:1 }, stay:true,
    say:'Отправляй — заказ закрыт' },
  { level:4 },

  // единственный выход на карту за весь вариант — и он же конец обучения:
  // дальше свободная игра, а она живёт на карте
  { close:true, who:'granny', text:'Вот теперь вижу — с деревней ты поладил. Дальше сам справишься' },
];

window.farm = createFarm({ script: SCRIPT, variant:'b' });
</script>
</body>
</html>
